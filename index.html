<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolekcja Cytatów</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e5e5e5;
        }

        .serif-font {
            font-family: 'Cinzel', serif;
        }

        /* Gold Gradient Elements */
        .gold-border {
            border-color: rgba(217, 119, 6, 0.3);
        }

        .gold-border-focus:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
        }

        .gold-gradient-bg:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d97706;
        }
    </style>
</head>
<body class="min-h-screen pb-12 antialiased">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-amber-900/40 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold serif-font gold-gradient-text flex items-center gap-2">
                <i class="fa-solid fa-quote-left text-amber-500 text-sm"></i> CYTATY
            </h1>

            <div class="flex items-center gap-3">
                <!-- Global Language Switcher -->
                <div class="flex bg-neutral-900 border border-amber-900/40 rounded-lg p-1 text-xs">
                    <button onclick="setGlobalLang('pl')" id="btn-global-pl" class="px-2 py-1 rounded font-semibold text-amber-400 bg-amber-950/80">PL</button>
                    <button onclick="setGlobalLang('en')" id="btn-global-en" class="px-2 py-1 rounded font-semibold text-neutral-400 hover:text-amber-400">EN</button>
                    <button onclick="setGlobalLang('de')" id="btn-global-de" class="px-2 py-1 rounded font-semibold text-neutral-400 hover:text-amber-400">DE</button>
                </div>

                <!-- Backup Menu Button -->
                <button onclick="toggleBackupModal()" class="p-2 text-amber-500/80 hover:text-amber-400 rounded-lg bg-neutral-900 border border-amber-900/40 hover:border-amber-500/50 transition">
                    <i class="fa-solid fa-database"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

        <!-- Random Quote Header Banner -->
        <div id="random-quote-card" class="bg-gradient-to-r from-neutral-950 via-amber-950/20 to-neutral-950 border border-amber-500/30 rounded-2xl p-5 md:p-6 relative overflow-hidden shadow-2xl">
            <div class="absolute -right-6 -bottom-6 text-neutral-900/40 text-9xl pointer-events-none serif-font">“</div>
            <div class="flex justify-between items-start mb-3">
                <span class="text-xs uppercase tracking-widest text-amber-500/80 font-bold flex items-center gap-1.5">
                    <i class="fa-solid fa-sparkles"></i> Losowy Cytat
                </span>
                <button onclick="displayRandomQuote()" class="text-amber-400/70 hover:text-amber-300 text-xs flex items-center gap-1 transition">
                    <i class="fa-solid fa-rotate"></i> Inny
                </button>
            </div>
            <blockquote id="random-quote-text" class="text-lg md:text-xl font-serif text-amber-100 italic mb-3">
                "Wczytywanie..."
            </blockquote>
            <div class="flex justify-between items-center text-sm">
                <p id="random-quote-author" class="text-amber-400 font-semibold">— Autor</p>
                <p id="random-quote-source" class="text-neutral-500 text-xs italic">Źródło</p>
            </div>
        </div>

        <!-- Add Quote Form Button / Toggle -->
        <div class="bg-neutral-950 border border-amber-900/30 rounded-2xl p-4 md:p-6 shadow-xl">
            <button onclick="toggleForm()" class="w-full flex justify-between items-center text-amber-400 font-semibold text-sm">
                <span class="flex items-center gap-2"><i class="fa-solid fa-plus-circle text-amber-500"></i> Dodaj Nowy Cytat</span>
                <i id="form-chevron" class="fa-solid fa-chevron-down transition-transform"></i>
            </button>

            <form id="add-quote-form" onsubmit="saveQuote(event)" class="hidden mt-5 space-y-4 pt-4 border-t border-neutral-900">
                <!-- Authors & Source Inputs -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">Autor *</label>
                        <input type="text" id="input-author" required placeholder="np. Arthur Leywin" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200 gold-border-focus outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">Źródło (Książka, tom, rok)</label>
                        <input type="text" id="input-source" placeholder="np. Tom 1, Rozdział 12" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200 gold-border-focus outline-none">
                    </div>
                </div>

                <!-- Languages Tabs/Fields -->
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-amber-400/90 mb-1 font-semibold">Cytat po polsku (Wymagane) *</label>
                        <textarea id="input-text-pl" required rows="2" placeholder="Wpisz treść w języku polskim..." class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-sm text-neutral-100 gold-border-focus outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">Angielskie tłumaczenie (Opcjonalnie)</label>
                        <textarea id="input-text-en" rows="2" placeholder="English version..." class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-sm text-neutral-100 gold-border-focus outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">Niemieckie tłumaczenie (Opcjonalnie)</label>
                        <textarea id="input-text-de" rows="2" placeholder="Deutsche Version..." class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-sm text-neutral-100 gold-border-focus outline-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="toggleForm()" class="px-4 py-2 rounded-lg text-xs font-semibold text-neutral-400 hover:text-white transition">Anuluj</button>
                    <button type="submit" class="gold-gradient-bg text-black font-bold px-6 py-2 rounded-lg text-xs shadow-lg transition">Zapisz Cytat</button>
                </div>
            </form>
        </div>

        <!-- Controls Bar: Search & Filter -->
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div class="relative w-full sm:w-auto flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-neutral-500 text-xs"></i>
                <input type="text" id="search-input" oninput="renderQuotes()" placeholder="Szukaj cytatu, autora lub źródła..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-neutral-200 gold-border-focus outline-none">
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button id="filter-all" onclick="setFilter('all')" class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30">Wszystkie</button>
                <button id="filter-fav" onclick="setFilter('fav')" class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-neutral-950 text-neutral-400 border border-neutral-800 hover:border-amber-500/30">
                    <i class="fa-solid fa-heart text-red-500/80 mr-1"></i> Ulubione
                </button>
            </div>
        </div>

        <!-- Quotes Feed Container -->
        <div id="quotes-container" class="space-y-4">
            <!-- Dynamic Quote Cards Rendered Here -->
        </div>

    </main>

    <!-- Backup Modal (Import/Export) -->
    <div id="backup-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-neutral-950 border border-amber-900/40 rounded-2xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-neutral-900 pb-3">
                <h3 class="text-sm font-bold text-amber-400 uppercase tracking-wider">Kopia zapasowa</h3>
                <button onclick="toggleBackupModal()" class="text-neutral-500 hover:text-neutral-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-neutral-400">Pobierz swoje cytaty do pliku JSON lub przywróć je na innym urządzeniu.</p>

            <div class="space-y-3 pt-2">
                <button onclick="exportData()" class="w-full bg-neutral-900 border border-amber-900/40 hover:border-amber-500/60 text-amber-300 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-download"></i> Eksportuj Cytaty (JSON)
                </button>

                <label class="w-full bg-neutral-900 border border-neutral-800 hover:border-neutral-700 text-neutral-300 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer transition">
                    <i class="fa-solid fa-upload"></i> Importuj z pliku JSON
                    <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initial Sample Data
        const initialQuotes = [
            {
                id: '1',
                author: 'George Orwell',
                source: '1984',
                text: {
                    pl: 'Kto rządzi przeszłością, ten rządzi przyszłością. Kto rządzi teraźniejszością, ten rządzi przeszłością.',
                    en: 'Who controls the past controls the future. Who controls the present controls the past.',
                    de: 'Wer die Vergangenheit kontrolliert, kontrolliert die Zukunft. Wer die Gegenwart kontrolliert, kontrolliert die Vergangenheit.'
                },
                isFavorite: true,
                cardLang: 'pl'
            },
            {
                id: '2',
                author: 'Fang Yuan',
                source: 'Reverend Insanity',
                text: {
                    pl: 'Ludzie żyją tylko przez sto lat, to tak krótkie jak sen. Jaki jest sens życia w strachu i podporządkowaniu?',
                    en: 'Man lives for merely a hundred years, it is as short as a dream. What is the point of living in fear and submission?',
                    de: 'Der Mensch lebt nur hundert Jahre, das ist kurz wie ein Traum. Was nützt es, in Angst und Unterwerfung zu leben?'
                },
                isFavorite: false,
                cardLang: 'pl'
            }
        ];

        let quotes = JSON.parse(localStorage.getItem('my_quotes_app')) || initialQuotes;
        let globalLang = 'pl';
        let currentFilter = 'all';

        // Save to LocalStorage
        function saveToStorage() {
            localStorage.setItem('my_quotes_app', JSON.stringify(quotes));
        }

        // Global Language Switch
        function setGlobalLang(lang) {
            globalLang = lang;
            ['pl', 'en', 'de'].forEach(l => {
                const btn = document.getElementById(`btn-global-${l}`);
                if (l === lang) {
                    btn.className = 'px-2 py-1 rounded font-semibold text-amber-400 bg-amber-950/80';
                } else {
                    btn.className = 'px-2 py-1 rounded font-semibold text-neutral-400 hover:text-amber-400';
                }
            });

            // Update all cards to match global lang
            quotes = quotes.map(q => ({ ...q, cardLang: lang }));
            saveToStorage();
            renderQuotes();
            displayRandomQuote();
        }

        // Change Individual Card Language
        function setCardLang(id, lang) {
            const index = quotes.findIndex(q => q.id === id);
            if (index !== -1) {
                quotes[index].cardLang = lang;
                saveToStorage();
                renderQuotes();
            }
        }

        // Toggle Favorite Status
        function toggleFavorite(id) {
            const index = quotes.findIndex(q => q.id === id);
            if (index !== -1) {
                quotes[index].isFavorite = !quotes[index].isFavorite;
                saveToStorage();
                renderQuotes();
            }
        }

        // Delete Quote
        function deleteQuote(id) {
            if (confirm('Czy na pewno chcesz usunąć ten cytat?')) {
                quotes = quotes.filter(q => q.id !== id);
                saveToStorage();
                renderQuotes();
                displayRandomQuote();
            }
        }

        // Filter Switcher
        function setFilter(filter) {
            currentFilter = filter;
            const btnAll = document.getElementById('filter-all');
            const btnFav = document.getElementById('filter-fav');

            if (filter === 'all') {
                btnAll.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30';
                btnFav.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-neutral-950 text-neutral-400 border border-neutral-800 hover:border-amber-500/30';
            } else {
                btnFav.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30';
                btnAll.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-neutral-950 text-neutral-400 border border-neutral-800 hover:border-amber-500/30';
            }
            renderQuotes();
        }

        // Render Cards List
        function renderQuotes() {
            const container = document.getElementById('quotes-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            let filtered = quotes.filter(q => {
                const activeText = (q.text[q.cardLang || 'pl'] || q.text.pl || '').toLowerCase();
                const matchesSearch = activeText.includes(searchVal) ||
                                      q.author.toLowerCase().includes(searchVal) ||
                                      (q.source && q.source.toLowerCase().includes(searchVal));
                const matchesFav = currentFilter === 'fav' ? q.isFavorite : true;
                return matchesSearch && matchesFav;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-neutral-950 border border-neutral-900 rounded-2xl">
                        <i class="fa-solid fa-quote-right text-neutral-700 text-3xl mb-2"></i>
                        <p class="text-xs text-neutral-500">Brak cytatów spełniających kryteria.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(q => {
                const currentCardLang = q.cardLang || 'pl';
                const quoteDisplay = q.text[currentCardLang] || q.text.pl || 'Brak treści w tym języku';

                return `
                    <div class="bg-neutral-950 border border-amber-900/30 hover:border-amber-500/40 rounded-2xl p-5 shadow-lg transition space-y-3 relative group">
                        <!-- Top Card Header: Lang switchers & Fav button -->
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-1 bg-neutral-900 border border-neutral-800 rounded-md p-0.5 text-[10px]">
                                <button onclick="setCardLang('${q.id}', 'pl')" class="px-1.5 py-0.5 rounded ${currentCardLang === 'pl' ? 'bg-amber-500 text-black font-bold' : 'text-neutral-400 hover:text-white'}">PL</button>
                                <button onclick="setCardLang('${q.id}', 'en')" class="px-1.5 py-0.5 rounded ${currentCardLang === 'en' ? 'bg-amber-500 text-black font-bold' : 'text-neutral-400 hover:text-white'}">EN</button>
                                <button onclick="setCardLang('${q.id}', 'de')" class="px-1.5 py-0.5 rounded ${currentCardLang === 'de' ? 'bg-amber-500 text-black font-bold' : 'text-neutral-400 hover:text-white'}">DE</button>
                            </div>

                            <div class="flex items-center gap-2">
                                <button onclick="toggleFavorite('${q.id}')" class="text-neutral-600 hover:text-red-500 transition text-sm">
                                    <i class="${q.isFavorite ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart"></i>
                                </button>
                                <button onclick="copyToClipboard('${quoteDisplay.replace(/'/g, "\\'")}')" class="text-neutral-500 hover:text-amber-400 transition text-xs" title="Kopiuj">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button onclick="deleteQuote('${q.id}')" class="text-neutral-600 hover:text-amber-600 transition text-xs" title="Usuń">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Quote Text -->
                        <blockquote class="text-base text-neutral-200 serif-font italic leading-relaxed pt-1">
                            "${quoteDisplay}"
                        </blockquote>

                        <!-- Author & Source -->
                        <div class="flex justify-between items-center text-xs pt-2 border-t border-neutral-900">
                            <span class="text-amber-400 font-semibold">— ${q.author}</span>
                            ${q.source ? `<span class="text-neutral-500 italic text-[11px]">${q.source}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Random Quote Generator
        function displayRandomQuote() {
            if (quotes.length === 0) {
                document.getElementById('random-quote-text').innerText = '"Brak dodanych cytatów"';
                document.getElementById('random-quote-author').innerText = '—';
                document.getElementById('random-quote-source').innerText = '';
                return;
            }

            const randomIndex = Math.floor(Math.random() * quotes.length);
            const random = quotes[randomIndex];
            const textDisplay = random.text[globalLang] || random.text.pl || random.text.en || '';

            document.getElementById('random-quote-text').innerText = `"${textDisplay}"`;
            document.getElementById('random-quote-author').innerText = `— ${random.author}`;
            document.getElementById('random-quote-source').innerText = random.source || '';
        }

        // Save Quote Form Handler
        function saveQuote(e) {
            e.preventDefault();
            const author = document.getElementById('input-author').value.trim();
            const source = document.getElementById('input-source').value.trim();
            const textPl = document.getElementById('input-text-pl').value.trim();
            const textEn = document.getElementById('input-text-en').value.trim();
            const textDe = document.getElementById('input-text-de').value.trim();

            const newQuote = {
                id: Date.now().toString(),
                author: author,
                source: source,
                text: {
                    pl: textPl,
                    en: textEn,
                    de: textDe
                },
                isFavorite: false,
                cardLang: 'pl'
            };

            quotes.unshift(newQuote);
            saveToStorage();
            renderQuotes();
            displayRandomQuote();

            // Reset Form & Close
            document.getElementById('add-quote-form').reset();
            toggleForm();
        }

        // Form Toggle Animation
        function toggleForm() {
            const form = document.getElementById('add-quote-form');
            const chevron = document.getElementById('form-chevron');
            form.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        // Modal Toggle
        function toggleBackupModal() {
            const modal = document.getElementById('backup-modal');
            modal.classList.toggle('hidden');
        }

        // Copy Text
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Cytat skopiowano do schowka!');
        }

        // Export JSON
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quotes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `cytaty_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Import JSON
        function importData(e) {
            const fileReader = new FileReader();
            fileReader.onload = function (event) {
                try {
                    const importedQuotes = JSON.parse(event.target.result);
                    if (Array.isArray(importedQuotes)) {
                        quotes = importedQuotes;
                        saveToStorage();
                        renderQuotes();
                        displayRandomQuote();
                        toggleBackupModal();
                        alert('Pomyślnie zaimportowano cytaty!');
                    } else {
                        alert('Nieprawidłowy format pliku JSON.');
                    }
                } catch (err) {
                    alert('Błąd podczas odczytu pliku JSON.');
                }
            };
            fileReader.readAsText(e.target.files[0]);
        }

        // Initialization
        renderQuotes();
        displayRandomQuote();
    </script>
</body>
</html>
