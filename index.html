<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolekcja Cytatów</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #14131a 0%, #08080a 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .font-serif-custom {
            font-family: 'Cinzel', serif;
        }

        /* Glassmorphic Cards */
        .glass-card {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(217, 119, 6, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.45);
            box-shadow: 0 10px 35px 0 rgba(245, 158, 11, 0.1);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-button {
            background: linear-gradient(135deg, #d97706 0%, #92400e 100%);
            transition: all 0.2s ease;
        }

        .gold-button:hover {
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #08080a;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d97706;
        }
    </style>
</head>
<body class="pb-12 antialiased">

    <!-- Navbar Header -->
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-amber-900/30 px-4 py-3.5">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-feather-pointed text-amber-500 text-base"></i>
                <span class="text-lg font-bold font-serif-custom gold-gradient-text tracking-wider">CYTATY</span>
            </div>

            <div class="flex items-center gap-3">
                <!-- Global Language Switcher -->
                <div class="flex bg-zinc-900/90 border border-amber-900/40 rounded-lg p-1 text-xs">
                    <button onclick="setGlobalLang('pl')" id="btn-global-pl" class="px-2.5 py-1 rounded font-bold text-amber-400 bg-amber-950/80">PL</button>
                    <button onclick="setGlobalLang('en')" id="btn-global-en" class="px-2.5 py-1 rounded font-bold text-zinc-400 hover:text-amber-400">EN</button>
                    <button onclick="setGlobalLang('de')" id="btn-global-de" class="px-2.5 py-1 rounded font-bold text-zinc-400 hover:text-amber-400">DE</button>
                </div>

                <!-- Backup Modal Trigger -->
                <button onclick="toggleBackupModal()" class="p-2 text-amber-500/80 hover:text-amber-300 rounded-lg bg-zinc-900/90 border border-amber-900/40 hover:border-amber-500/50 transition">
                    <i class="fa-solid fa-floppy-disk"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

        <!-- Random Quote Header -->
        <div id="random-quote-card" class="glass-card rounded-2xl p-5 md:p-6 relative overflow-hidden">
            <div class="absolute -right-4 -bottom-6 text-zinc-800/20 text-9xl pointer-events-none font-serif-custom">“</div>
            <div class="flex justify-between items-start mb-3">
                <span class="text-[11px] uppercase tracking-widest text-amber-500/90 font-bold flex items-center gap-1.5">
                    <i class="fa-solid fa-sparkles text-amber-400"></i> Losowa myśl
                </span>
                <button onclick="displayRandomQuote()" class="text-amber-400/80 hover:text-amber-300 text-xs flex items-center gap-1 transition">
                    <i class="fa-solid fa-shuffle"></i> Losuj
                </button>
            </div>
            <blockquote id="random-quote-text" class="text-lg md:text-xl font-serif-custom text-zinc-100 italic leading-relaxed mb-3">
                "Wczytywanie..."
            </blockquote>
            <div class="flex justify-between items-end text-xs pt-2 border-t border-zinc-800/60">
                <div>
                    <p id="random-quote-character" class="text-amber-400 font-bold text-sm">Bohater</p>
                    <p id="random-quote-title" class="text-zinc-400 italic">Tytuł</p>
                </div>
                <p id="random-quote-author" class="text-zinc-500 text-[11px]">Autor</p>
            </div>
        </div>

        <!-- Add Quote Form -->
        <div class="glass-card rounded-2xl p-4 md:p-5">
            <button onclick="toggleForm()" class="w-full flex justify-between items-center text-amber-400 font-semibold text-xs tracking-wider uppercase">
                <span class="flex items-center gap-2"><i class="fa-solid fa-circle-plus text-amber-500 text-sm"></i> Dodaj cytat</span>
                <i id="form-chevron" class="fa-solid fa-chevron-down transition-transform"></i>
            </button>

            <form id="add-quote-form" onsubmit="saveQuote(event)" class="hidden mt-4 space-y-4 pt-4 border-t border-zinc-800/80">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[11px] text-amber-400 mb-1 font-semibold">Bohater (Mówca) *</label>
                        <input type="text" id="input-character" required placeholder="np. Fang Yuan" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:border-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Tytuł / Dzieło *</label>
                        <input type="text" id="input-title" required placeholder="np. Reverend Insanity" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:border-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Autor książki / dzieła</label>
                        <input type="text" id="input-author" placeholder="np. Gu Zhen Ren" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:border-amber-500 outline-none">
                    </div>
                </div>

                <div class="space-y-2.5">
                    <div>
                        <label class="block text-[11px] text-amber-400 mb-1 font-semibold">Cytat po polsku (Wymagany) *</label>
                        <textarea id="input-text-pl" required rows="2" placeholder="Treść po polsku..." class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-100 focus:border-amber-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Wersja angielska (Opcjonalnie)</label>
                        <textarea id="input-text-en" rows="2" placeholder="English text..." class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-100 focus:border-amber-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Wersja niemiecka (Opcjonalnie)</label>
                        <textarea id="input-text-de" rows="2" placeholder="Deutscher Text..." class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-100 focus:border-amber-500 outline-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="toggleForm()" class="px-4 py-2 rounded-xl text-xs text-zinc-400 hover:text-white transition">Anuluj</button>
                    <button type="submit" class="gold-button text-black font-bold px-5 py-2 rounded-xl text-xs shadow-lg">Zapisz Cytat</button>
                </div>
            </form>
        </div>

        <!-- Search & Filter Controls -->
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div class="relative w-full sm:w-auto flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                <input type="text" id="search-input" oninput="renderQuotes()" placeholder="Szukaj po treści, bohaterze, tytule lub autorze..." class="w-full bg-zinc-950/80 border border-zinc-800/80 rounded-xl pl-9 pr-4 py-2.5 text-xs text-zinc-200 focus:border-amber-500 outline-none">
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button id="filter-all" onclick="setFilter('all')" class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40">Wszystkie</button>
                <button id="filter-fav" onclick="setFilter('fav')" class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-zinc-950 text-zinc-400 border border-zinc-800 hover:border-amber-500/40">
                    <i class="fa-solid fa-heart text-rose-500 mr-1"></i> Ulubione
                </button>
            </div>
        </div>

        <!-- Feed Container -->
        <div id="quotes-container" class="space-y-4">
            <!-- Rendered Dynamic Cards -->
        </div>

    </main>

    <!-- Modal Backup -->
    <div id="backup-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl max-w-md w-full p-6 space-y-4 border-amber-500/40">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Zarządzanie Baza Danych</h3>
                <button onclick="toggleBackupModal()" class="text-zinc-500 hover:text-zinc-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-zinc-400 leading-relaxed">Możesz zapisać swoją aktualną bazę do pliku JSON lub wczytać zaktualizowany plik z dysku.</p>

            <div class="space-y-3 pt-2">
                <button onclick="exportData()" class="w-full bg-zinc-900 border border-amber-900/50 hover:border-amber-500/60 text-amber-300 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-download"></i> Eksportuj do quotes.json
                </button>

                <label class="w-full bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-300 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer transition">
                    <i class="fa-solid fa-upload"></i> Wczytaj z pliku JSON
                    <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let quotes = [];
        let globalLang = 'pl';
        let currentFilter = 'all';

        async function loadQuotes() {
            const localData = localStorage.getItem('my_quotes_app');
            if (localData) {
                quotes = JSON.parse(localData);
                renderQuotes();
                displayRandomQuote();
            } else {
                try {
                    const response = await fetch('quotes.json');
                    if (response.ok) {
                        quotes = await response.json();
                        saveToStorage();
                    } else {
                        quotes = [];
                    }
                } catch (err) {
                    quotes = [];
                }
                renderQuotes();
                displayRandomQuote();
            }
        }

        function saveToStorage() {
            localStorage.setItem('my_quotes_app', JSON.stringify(quotes));
        }

        function setGlobalLang(lang) {
            globalLang = lang;
            ['pl', 'en', 'de'].forEach(l => {
                const btn = document.getElementById(`btn-global-${l}`);
                if (l === lang) {
                    btn.className = 'px-2.5 py-1 rounded font-bold text-amber-400 bg-amber-950/80';
                } else {
                    btn.className = 'px-2.5 py-1 rounded font-bold text-zinc-400 hover:text-amber-400';
                }
            });

            quotes = quotes.map(q => ({ ...q, cardLang: lang }));
            saveToStorage();
            renderQuotes();
            displayRandomQuote();
        }

        function setCardLang(id, lang) {
            const index = quotes.findIndex(q => q.id === id);
            if (index !== -1) {
                quotes[index].cardLang = lang;
                saveToStorage();
                renderQuotes();
            }
        }

        function toggleFavorite(id) {
            const index = quotes.findIndex(q => q.id === id);
            if (index !== -1) {
                quotes[index].isFavorite = !quotes[index].isFavorite;
                saveToStorage();
                renderQuotes();
            }
        }

        function deleteQuote(id) {
            if (confirm('Czy na pewno chcesz usunąć ten cytat?')) {
                quotes = quotes.filter(q => q.id !== id);
                saveToStorage();
                renderQuotes();
                displayRandomQuote();
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            const btnAll = document.getElementById('filter-all');
            const btnFav = document.getElementById('filter-fav');

            if (filter === 'all') {
                btnAll.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40';
                btnFav.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-zinc-950 text-zinc-400 border border-zinc-800 hover:border-amber-500/40';
            } else {
                btnFav.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40';
                btnAll.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs font-semibold bg-zinc-950 text-zinc-400 border border-zinc-800 hover:border-amber-500/40';
            }
            renderQuotes();
        }

        function renderQuotes() {
            const container = document.getElementById('quotes-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            let filtered = quotes.filter(q => {
                const activeText = (q.text[q.cardLang || 'pl'] || q.text.pl || '').toLowerCase();
                const matchesSearch = activeText.includes(searchVal) ||
                                      (q.character && q.character.toLowerCase().includes(searchVal)) ||
                                      (q.title && q.title.toLowerCase().includes(searchVal)) ||
                                      (q.author && q.author.toLowerCase().includes(searchVal));
                const matchesFav = currentFilter === 'fav' ? q.isFavorite : true;
                return matchesSearch && matchesFav;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 glass-card rounded-2xl">
                        <i class="fa-solid fa-quote-right text-zinc-600 text-2xl mb-2"></i>
                        <p class="text-xs text-zinc-500">Brak cytatów pasujących do filtrowania.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(q => {
                const currentCardLang = q.cardLang || 'pl';
                const quoteDisplay = q.text[currentCardLang] || q.text.pl || 'Brak tłumaczenia';

                return `
                    <div class="glass-card rounded-2xl p-5 transition space-y-3 relative">
                        <div class="flex justify-between items-center">
                            <!-- Card Lang buttons -->
                            <div class="flex items-center gap-1 bg-zinc-900/90 border border-zinc-800 rounded-lg p-0.5 text-[10px]">
                                <button onclick="setCardLang('${q.id}', 'pl')" class="px-2 py-0.5 rounded font-bold ${currentCardLang === 'pl' ? 'bg-amber-500 text-black' : 'text-zinc-400 hover:text-white'}">PL</button>
                                <button onclick="setCardLang('${q.id}', 'en')" class="px-2 py-0.5 rounded font-bold ${currentCardLang === 'en' ? 'bg-amber-500 text-black' : 'text-zinc-400 hover:text-white'}">EN</button>
                                <button onclick="setCardLang('${q.id}', 'de')" class="px-2 py-0.5 rounded font-bold ${currentCardLang === 'de' ? 'bg-amber-500 text-black' : 'text-zinc-400 hover:text-white'}">DE</button>
                            </div>

                            <!-- Controls -->
                            <div class="flex items-center gap-2.5">
                                <button onclick="toggleFavorite('${q.id}')" class="text-zinc-500 hover:text-rose-500 transition text-sm">
                                    <i class="${q.isFavorite ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart"></i>
                                </button>
                                <button onclick="copyToClipboard('${quoteDisplay.replace(/'/g, "\\'")}')" class="text-zinc-500 hover:text-amber-400 transition text-xs">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button onclick="deleteQuote('${q.id}')" class="text-zinc-600 hover:text-amber-600 transition text-xs">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Quote Text -->
                        <blockquote class="text-base text-zinc-100 font-serif-custom italic leading-relaxed pt-1">
                            "${quoteDisplay}"
                        </blockquote>

                        <!-- Character, Title & Author -->
                        <div class="flex justify-between items-end text-xs pt-2 border-t border-zinc-800/60">
                            <div>
                                <span class="text-amber-400 font-bold block">${q.character || 'Nieznany bohater'}</span>
                                ${q.title ? `<span class="text-zinc-400 italic text-[11px]">${q.title}</span>` : ''}
                            </div>
                            ${q.author ? `<span class="text-zinc-500 text-[11px]">autor: ${q.author}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function displayRandomQuote() {
            if (quotes.length === 0) {
                document.getElementById('random-quote-text').innerText = '"Brak cytatów w bazie"';
                document.getElementById('random-quote-character').innerText = '—';
                document.getElementById('random-quote-title').innerText = '';
                document.getElementById('random-quote-author').innerText = '';
                return;
            }

            const randomIndex = Math.floor(Math.random() * quotes.length);
            const random = quotes[randomIndex];
            const textDisplay = random.text[globalLang] || random.text.pl || random.text.en || '';

            document.getElementById('random-quote-text').innerText = `"${textDisplay}"`;
            document.getElementById('random-quote-character').innerText = random.character || 'Nieznany bohater';
            document.getElementById('random-quote-title').innerText = random.title || '';
            document.getElementById('random-quote-author').innerText = random.author ? `autor: ${random.author}` : '';
        }

        function saveQuote(e) {
            e.preventDefault();
            const character = document.getElementById('input-character').value.trim();
            const title = document.getElementById('input-title').value.trim();
            const author = document.getElementById('input-author').value.trim();
            const textPl = document.getElementById('input-text-pl').value.trim();
            const textEn = document.getElementById('input-text-en').value.trim();
            const textDe = document.getElementById('input-text-de').value.trim();

            const newQuote = {
                id: Date.now().toString(),
                character: character,
                title: title,
                author: author,
                text: { pl: textPl, en: textEn, de: textDe },
                isFavorite: false,
                cardLang: 'pl'
            };

            quotes.unshift(newQuote);
            saveToStorage();
            renderQuotes();
            displayRandomQuote();

            document.getElementById('add-quote-form').reset();
            toggleForm();
        }

        function toggleForm() {
            const form = document.getElementById('add-quote-form');
            const chevron = document.getElementById('form-chevron');
            form.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function toggleBackupModal() {
            document.getElementById('backup-modal').classList.toggle('hidden');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Cytat skopiowany do schowka!');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quotes, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `quotes.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }

        function importData(e) {
            const fileReader = new FileReader();
            fileReader.onload = function (event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        quotes = imported;
                        saveToStorage();
                        renderQuotes();
                        displayRandomQuote();
                        toggleBackupModal();
                        alert('Baza danych została pomyślnie zaktualizowana!');
                    }
                } catch (err) {
                    alert('Niepoprawny plik JSON.');
                }
            };
            fileReader.readAsText(e.target.files[0]);
        }

        // Initialize App
        loadQuotes();
    </script>
</body>
</html>
